name: My Example
on:
  push:
    branches:
      - main
jobs:
  deployment:
    name: Deploy My Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r apps.zip app1 app2 app3

      - run: echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > server_key.pem
      - run: chmod 400 server_key.pem

      - run: mkdir ~/.ssh
      - run: echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - run: scp -i ./server_key.pem ./apps.zip ubuntu@43.208.241.208:/home/ubuntu/

      - run: ssh -i ./server_key.pem ubuntu@43.208.241.208 && ls-la

#   - On Git
#   pull
#   zip
#   scp -i <???> to ec2
#
#   ssh to ec2
#   - On Ec2
#   unzip &&
#   stop pm2 &&
#   pull &&
#   npm install &&
#   pm2 run &&
