name: My Example
on:
  push:
    branches:
      - main
jobs:
  deployment:
    name: Deploy My Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r apps.zip app1 app2 app3
      - run: which scp && which ssh

