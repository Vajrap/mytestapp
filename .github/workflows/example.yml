name: My Example
on:
  push:
    branches:
      - main
jobs:
  deployment:
    name: Deploy My Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r apps.zip app1 app2 app3
      - run: echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > server_key.pem
      - run: cat server_key.pem
      # - run: scp -i ./server_key.pem

