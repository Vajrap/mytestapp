name: My Example
on:
  push:
    branches:
      - main
jobs:
  deployment:
    name: Deploy My Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Pull Code
      - run: ls -la
        name: check pull
      - run: sudo apt update
      - run: sudo apt install zip
      - run: zip -r apps.zip app1 app2 app3
      - run: ls -la

#   - On Git
#   pull
#   apt update & install zip
#   zip
#   scp to ec2
#   ssh to ec2
#   - On Ec2
#   unzip
#   stop pm2
#   pull
#   npm install
#   pm2 run
