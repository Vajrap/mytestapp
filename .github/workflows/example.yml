name: My Example
on:
  push:
    branches:
      - main
jobs:
  deployment:
    name: Deploy My Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r apps.zip app1 app2 app3

      - run: echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > server_key.pem
      - run: chmod 400 server_key.pem

      - run: mkdir ~/.ssh
      - run: echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - run: scp -i ./server_key.pem ./apps.zip ubuntu@vajrap.space:/home/ubuntu/

      - run: |
          ssh -i ./server_key.pem ubuntu@vajrap.space "
            pm2 stop app1 app2 app3 || true
            rm -r app1 app2 app3
            unzip apps.zip
            cd ~/app1
            npm install
            cd ~/app2
            npm install
            cd ~/app3
            npm install
            pm2 start ~/app1/app1.js ~/app2/app2.js ~/app3/app3.js
          "

